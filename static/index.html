$('#src-add-path').addEventListener('click', function(){
  const providers = getProviderOptions();
  const defID = providers.length ? providers[0].id : '';
  state.editingSourcePaths.push({ provider_id: defID, path: '/' });
  renderEditingPaths();
});
$('#src-submit').addEventListener('click', async function(){
  const id = $('#src-id').value;
  const name = $('#src-name').value.trim();
  if (!name){ toast('音源名称必填', 'err'); return; }
  const rows = document.querySelectorAll('#src-paths-list .path-row');
  const paths = [];
  rows.forEach(row => {
    const pid = row.querySelector('[data-field="provider_id"]').value;
    const path = row.querySelector('[data-field="path"]').value.trim();
    if (pid && path) paths.push({ provider_id: pid, path: path });
  });
  if (!paths.length){ toast('至少需要一条有效路径', 'err'); return; }
  try {
    if (id){
      await api('/api/sources/' + encodeURIComponent(id), {
        method: 'PUT', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: name, paths: paths })
      });
      toast('音源已更新', 'ok');
    } else {
      await api('/api/sources', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ name: name, paths: paths })
      });
      toast('音源已创建', 'ok');
    }
    $('#source-modal').classList.remove('show');
    await loadSources();
    refreshSourcesForm();
    buildFilterOptions();
    applyFilter();
  } catch(e){ toast('保存失败：' + e.message, 'err'); }
});

$('#src-dir-cancel').addEventListener('click', () => $('#src-dir-modal').classList.remove('show'));
$('#src-dir-modal').addEventListener('click', e => { if (e.target.id === 'src-dir-modal') e.target.classList.remove('show'); });
$('#src-dir-up').addEventListener('click', function(){
  if (dirPickCurPath === '/' || !dirPickCurPath) return;
  const parts = dirPickCurPath.split('/').filter(Boolean);
  parts.pop();
  dirLoadDir('/' + parts.join('/'));
});
$('#src-dir-pick').addEventListener('click', function(){
  if (dirPickOnSelect) dirPickOnSelect(dirPickCurPath);
  $('#src-dir-modal').classList.remove('show');
});

$('#btn-logout').addEventListener('click', async () => {
  if (!confirm('退出登录？')) return;
  try {
    await fetch('/api/web-auth/logout', {method: 'POST', credentials: 'same-origin'});
  } catch(e){}
  location.reload();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape'){
    if ($('#src-dir-modal').classList.contains('show')) { $('#src-dir-modal').classList.remove('show'); return; }
    if ($('#user-modal').classList.contains('show')) { $('#user-modal').classList.remove('show'); return; }
    if ($('#np-page').classList.contains('show')) { closeNP(); return; }
    if ($('#queue-panel').classList.contains('show')) { toggleQueue(false); return; }
    if (state.selected.size){ state.selected.clear(); render(); }
    $('#scan-modal').classList.remove('show');
    $('#source-modal').classList.remove('show');
    $('#pl-modal').classList.remove('show');
    $('#online-modal').classList.remove('show');
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 'a'){
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    if (state.mainView !== 'songs') return;
    e.preventDefault();
    state.filtered.forEach(s => state.selected.add(s.id));
    render();
  }
});

function checkResponsive(){
  const small = window.innerWidth <= 900;
  $('#btn-menu').style.display = small ? '' : 'none';
}
window.addEventListener('resize', checkResponsive);
checkResponsive();
$('#btn-menu').addEventListener('click', () => $('#sidebar').classList.toggle('open'));
document.addEventListener('click', e => {
  if (window.innerWidth > 900) return;
  const sb = $('#sidebar');
  if (!sb.classList.contains('open')) return;
  if (sb.contains(e.target) || e.target.closest('#btn-menu')) return;
  sb.classList.remove('open');
});

async function createPlaylist(){
  const name = $('#pl-new-name').value.trim();
  const comment = $('#pl-new-comment').value.trim();
  const isPublic = $('#pl-new-public').checked;
  if (!name) return toast('请输入歌单名称', 'err');
  const body = { name, song_ids: [] };
  if (comment) body.comment = comment;
  if (isPublic) body.public = true;
  $('#pl-submit').disabled = true;
  try {
    await api('/api/playlists', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(body)
    });
    toast('歌单已创建', 'ok');
    $('#pl-modal').classList.remove('show');
    $('#pl-new-name').value = '';
    $('#pl-new-comment').value = '';
    $('#pl-new-public').checked = false;
    await loadPlaylists(); renderSidebar();
  } catch (e){ toast('创建失败：' + e.message, 'err'); }
  finally { $('#pl-submit').disabled = false; }
}

function applyRoleUI(){
  const admin = isAdmin();
  if (admin){
    $('#admin-nav-section').style.display = '';
    $('#btn-online-search').style.display = '';
    $('#btn-delete').style.display = '';
  } else {
    $('#admin-nav-section').style.display = 'none';
    $('#btn-online-search').style.display = 'none';
    $('#btn-delete').style.display = 'none';
  }
  const nu = $('#nav-user');
  if (state.me.username){
    nu.style.display = '';
    $('#nav-user-avatar').textContent = state.me.username.charAt(0).toUpperCase();
    $('#nav-user-name').textContent = state.me.username;
    const roleEl = $('#nav-user-role');
    roleEl.textContent = admin ? '管理员' : '普通用户';
    roleEl.className = 'nav-user-role' + (admin ? ' admin' : '');
  }
}

async function boot(){
  try {
    let session;
    try {
      const r = await fetch('/api/web-auth/session', {credentials:'same-origin'});
      if (r.status === 401){ showLoginModal(); return; }
      session = await r.json();
    } catch(e){ showLoginModal(); return; }

    state.me.username = session.username || '';
    state.me.role = session.role || 'user';

    applyRoleUI();

    await Promise.all([loadSongs(), loadPlaylists(), loadSources()]);

    const saved = loadUIState();
    if (saved){
      if (saved.pageSize) state.pageSize = saved.pageSize;
      if (saved.filterAlbum) state.filterAlbum = saved.filterAlbum;
      if (saved.filterSource) state.filterSource = saved.filterSource;
      if (saved.view === 'playlist' && saved.activePlaylistId &&
          state.playlists.find(p => p.id === saved.activePlaylistId)){
        state.activePlaylistId = saved.activePlaylistId;
        state.view = 'playlist';
        await loadPlaylistTracks(saved.activePlaylistId);
      } else {
        state.view = 'all';
        state.filterArtist = null;
      }
      if (saved.pageSize && $('#page-size')) $('#page-size').value = String(saved.pageSize);
    }
    renderSidebar();
    buildFilterOptions();
    if (state.filterSource && $('#f-source')) $('#f-source').value = state.filterSource;
    if (saved && saved.page) state.page = saved.page;
    applyFilter();
    if (saved && saved.mainView && saved.mainView !== 'songs' && isAdmin()) switchMainView(saved.mainView);
    else setViewTitle();
  } catch (e){
    $('#list-body').innerHTML = '<div class="empty"><div class="empty-title">加载失败</div><div class="empty-sub">' + esc(e.message) + '</div></div>';
  }
}
$('#btn-new-playlist').addEventListener('click', () => {
  $('#pl-modal').classList.add('show');
  setTimeout(() => $('#pl-new-name').focus(), 100);
});
$('#pl-cancel').addEventListener('click', () => $('#pl-modal').classList.remove('show'));
$('#pl-submit').addEventListener('click', createPlaylist);
$('#pl-modal').addEventListener('click', e => { if (e.target.id === 'pl-modal') e.target.classList.remove('show'); });
$('#pl-new-name').addEventListener('keydown', e => { if (e.key === 'Enter') createPlaylist(); });
$('#pl-new-comment').addEventListener('keydown', e => { if (e.key === 'Enter') createPlaylist(); });

boot();
})();
</script>
