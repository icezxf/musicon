services:
  musicon-go:
    build: .
    image: ghcr.io/icezxf/musicon-go:latest
    container_name: musicon-go
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      LISTEN: "0.0.0.0:8000"
      DB_PATH: "/app/data/musicon.db"
      WEB_USER: "re"
      WEB_PASS: "bo18"
    volumes:
      - ./data:/app/data
